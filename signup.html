<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — Neuronexus</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <h1 class="logo"><a href="index.html">Neuronexus</a></h1>
      <nav>
        <a class="btn btn-outline" href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <form id="signupForm" class="card" aria-labelledby="signupTitle" novalidate>
      <h2 id="signupTitle">Create your account</h2>

      <div class="form-row">
        <label for="fullName">Full name</label>
        <input id="fullName" name="name" type="text" required autocomplete="name" />
        <p class="error" id="nameError" aria-live="polite"></p>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
        <p class="error" id="emailError" aria-live="polite"></p>
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required autocomplete="new-password" />
          <button type="button" class="toggle-password" aria-label="Toggle password visibility">Show</button>
        </div>
        <p class="muted">Minimum 8 characters, with letters and numbers.</p>
        <p class="error" id="passwordError" aria-live="polite"></p>
      </div>

      <div class="form-row">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password" />
        <p class="error" id="confirmPasswordError" aria-live="polite"></p>
      </div>

      <div class="form-row">
        <button class="btn btn-cta" type="submit">Create account</button>
      </div>

      <p class="muted">Already have an account? <a href="login.html">Sign in</a></p>
      <p class="error" id="signupFormError" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year-signup"></span> Neuronexus</small>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>document.getElementById('year-signup').textContent = new Date().getFullYear();</script>
</body>
</html>
